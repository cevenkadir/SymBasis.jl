name: Documentation

on:
  push:
    branches:
      - main # update to match your development branch (master, main, dev, trunk, ...)
    tags: '*'
  pull_request:
  workflow_dispatch:

jobs:
  # Regenerates the SymBasis vs XDiag.jl vs QuSpin basis-construction benchmark (benchmark/)
  # and writes docs/src/benchmarks.md + the raw result CSVs. No plots are rendered here -- the
  # page embeds `@example` code blocks that Documenter executes live from the CSVs during
  # `docs/make.jl` (build job), so no image file ever needs to be generated or committed. Runs
  # on every push (to main or a tag) and on manual dispatch; skipped for pull_request events.
  benchmark:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QuSpin (latest, PyPI)
        run: pip install quspin
      - name: Install Julia deps (SymBasis dev checkout + XDiag/BenchmarkTools latest)
        shell: julia --color=yes --project=benchmark {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # Threads intentionally left at their defaults (JULIA_NUM_THREADS=auto picks up all
      # runner cores; OMP_NUM_THREADS is left unset so XDiag's/QuSpin's OpenMP-backed code
      # also uses its own default) -- this reports what each library actually does out of the
      # box, rather than an artificially single-threaded comparison.
      - name: Run benchmarks
        env:
          JULIA_NUM_THREADS: auto
        run: |
          julia --project=benchmark benchmark/spin_basis.jl
          julia --project=benchmark benchmark/fermion_basis.jl
          julia --project=benchmark benchmark/boson_basis.jl
          python benchmark/quspin_bench.py
          julia --project=benchmark benchmark/compare_results.jl
      # Hand the raw CSVs + generated page to the `build` job -- `docs/make.jl` renders the
      # plots live from these CSVs using the docs environment's CairoMakie (already required
      # there for docs/src/examples/pxp.md), so no image ever needs to be built or shipped here.
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-docs-page
          path: |
            docs/src/benchmarks.md
            benchmark/results/

  build:
    needs: benchmark
    # Run regardless of whether `benchmark` ran (push/dispatch) or was skipped (pull_request)
    # -- `needs:` otherwise cascades a skip into this job too.
    if: always() && !cancelled()
    # These permissions are needed to:
    # - Deploy the documentation: https://documenter.juliadocs.org/stable/man/hosting/#Permissions
    # - Delete old caches: https://github.com/julia-actions/cache#usage
    permissions:
      actions: write
      contents: write
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use this run's fresh benchmark results, if any were generated
        if: needs.benchmark.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: benchmark-docs-page
      - uses: julia-actions/setup-julia@v2
        with:
          version: '1'
      - uses: julia-actions/cache@v2
      - name: Install dependencies
        shell: julia --color=yes --project=docs {0}
        run: |
          using Pkg
          Pkg.develop(PackageSpec(path=pwd()))
          Pkg.instantiate()
      # Persist the raw CSVs + page to `main` so dev-docs between releases still render (live,
      # from this data) instead of going stale -- no image is committed, only the small
      # diffable source data the `@example` blocks in benchmarks.md read at build time. Done
      # via a separate worktree checked out from origin/main, since this job's own checkout may
      # be at a release tag, not main -- switching branches in place while carrying uncommitted
      # generated files could conflict.
      - name: Commit results to main
        if: needs.benchmark.result == 'success'
        run: |
          git fetch origin main
          git worktree add /tmp/main-checkout origin/main
          cp docs/src/benchmarks.md /tmp/main-checkout/docs/src/benchmarks.md
          mkdir -p /tmp/main-checkout/benchmark/results
          cp benchmark/results/*.csv /tmp/main-checkout/benchmark/results/
          cd /tmp/main-checkout
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/src/benchmarks.md benchmark/results/*.csv
          git diff --staged --quiet || (git commit -m "Update benchmark results [skip ci]" && git push origin HEAD:main)
      - name: Build and deploy
        run: julia --color=yes --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # If authenticating with GitHub Actions token
          DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }} # If authenticating with SSH deploy key
